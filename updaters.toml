# 包更新配置。顶层表名 = nvchecker.toml 中的包名 = 包目录名（目录名不同时用 directory 覆盖）。
#
# updater 类型：
#   declarative —— 按 assets 声明改写 PKGBUILD 的版本与 source/checksum 数组
#   vcs         —— clone VCS 源、checkout 到新版本后运行 PKGBUILD 的 pkgver()
#   command     —— 运行外部命令，{python} 会被替换为当前解释器
#
# asset 模板占位符分两层：
#   {version} {url} {filename} —— 更新时由 Python 替换；{url} 是实际下载并计算校验和的地址
#   $var / ${var}              —— 原样写入 PKGBUILD，由 makepkg 在构建时展开
# source_entry 写入 PKGBUILD 的 source 数组，沿用 makepkg 的 "文件名::URL" 语法。

[deepin-wine10-stable]
updater = "command"
command = ["{python}", "tools/deepin_wine10_stable/update.py"]

[spark-store-console-bin]
updater = "declarative"

[spark-store-console-bin.version]
variable = "_pkgver"
transform = "hyphen_to_underscore"

[[spark-store-console-bin.assets]]
kind = "release_asset"
index_url = "https://gitee.com/api/v5/repos/spark-store-project/spark-store/releases?page=1&per_page=100&direction=desc"
asset_name = "spark-store-console_{version}_all.deb"
source_field = "source_x86_64"
checksum_field = "sha256sums_x86_64"
source_entry = "{filename}::{url}"

[serenity-bin]
updater = "declarative"

[serenity-bin.version]
variable = "_pkgver"
transform = "remove_hyphen"

[[serenity-bin.assets]]
kind = "url"
url = "https://github.com/SagerNet/serenity/raw/v{version}/LICENSE"
source_field = "source"
checksum_field = "sha256sums"
source_entry = "LICENSE::$url/raw/v$_pkgver/LICENSE"

[[serenity-bin.assets]]
kind = "url"
url = "https://github.com/SagerNet/serenity/releases/download/v{version}/serenity_{version}_linux_386.pkg.tar.zst"
source_field = "source_i686"
checksum_field = "sha256sums_i686"
source_entry = "${_pkgname}_${_pkgver}_i686.tar.zst::$url/releases/download/v$_pkgver/${_pkgname}_${_pkgver}_linux_386.pkg.tar.zst"

[[serenity-bin.assets]]
kind = "url"
url = "https://github.com/SagerNet/serenity/releases/download/v{version}/serenity_{version}_linux_amd64.pkg.tar.zst"
source_field = "source_x86_64"
checksum_field = "sha256sums_x86_64"
source_entry = "${_pkgname}_${_pkgver}_x86_64.tar.zst::$url/releases/download/v$_pkgver/${_pkgname}_${_pkgver}_linux_amd64.pkg.tar.zst"

[[serenity-bin.assets]]
kind = "url"
url = "https://github.com/SagerNet/serenity/releases/download/v{version}/serenity_{version}_linux_arm64.pkg.tar.zst"
source_field = "source_aarch64"
checksum_field = "sha256sums_aarch64"
source_entry = "${_pkgname}_${_pkgver}_aarch64.tar.zst::$url/releases/download/v$_pkgver/${_pkgname}_${_pkgver}_linux_arm64.pkg.tar.zst"

[[serenity-bin.assets]]
kind = "url"
url = "https://github.com/SagerNet/serenity/releases/download/v{version}/serenity_{version}_linux_armv7.pkg.tar.zst"
source_field = "source_armv7h"
checksum_field = "sha256sums_armv7h"
source_entry = "${_pkgname}_${_pkgver}_armv7h.tar.zst::$url/releases/download/v$_pkgver/${_pkgname}_${_pkgver}_linux_armv7.pkg.tar.zst"

[xwayclip]
updater = "declarative"

[xwayclip.version]
variable = "_pkgver"
transform = "hyphen_to_underscore"

[[xwayclip.assets]]
kind = "url"
url = "https://github.com/so1ve/xwayclip/archive/refs/tags/v{version}.tar.gz"
source_field = "source"
checksum_field = "sha256sums"
source_entry = "$pkgname-$_pkgver.tar.gz::$url/archive/refs/tags/v$_pkgver.tar.gz"

[xwayclip-bin]
updater = "declarative"

[xwayclip-bin.version]
variable = "_pkgver"
transform = "hyphen_to_underscore"

[[xwayclip-bin.assets]]
kind = "url"
url = "https://raw.githubusercontent.com/so1ve/xwayclip/v{version}/LICENSE"
source_field = "source"
checksum_field = "sha256sums"
source_entry = "LICENSE::$url/raw/v$_pkgver/LICENSE"

[[xwayclip-bin.assets]]
kind = "url"
url = "https://github.com/so1ve/xwayclip/releases/download/v{version}/xwayclip-x86_64-unknown-linux-gnu"
source_field = "source_x86_64"
checksum_field = "sha256sums_x86_64"
source_entry = "$_pkgname-x86_64-unknown-linux-gnu::$url/releases/download/v$_pkgver/$_pkgname-x86_64-unknown-linux-gnu"

[[xwayclip-bin.assets]]
kind = "url"
url = "https://github.com/so1ve/xwayclip/releases/download/v{version}/xwayclip-aarch64-unknown-linux-gnu"
source_field = "source_aarch64"
checksum_field = "sha256sums_aarch64"
source_entry = "$_pkgname-aarch64-unknown-linux-gnu::$url/releases/download/v$_pkgver/$_pkgname-aarch64-unknown-linux-gnu"

[xwayclip-git]
updater = "vcs"
backend = "git"
source_name = "xwayclip-git"

[hfd-git]
updater = "vcs"
backend = "git"
source_name = "hfd-git"
