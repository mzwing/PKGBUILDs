name: Update AUR packages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-aur-packages
  cancel-in-progress: false

defaults:
  run:
    # A custom shell string runs a bare `bash {0}`; only the built-in `bash`
    # shell adds -eo pipefail. Spell it out so a failing command aborts the step.
    shell: devenv shell -- bash -eo pipefail {0}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      # Runs outside `devenv shell` so the old environment is never built, and
      # before every other step so they all use the refreshed one.
      - name: Update devenv inputs
        shell: bash
        run: devenv update

      - name: Sync nvchecker config
        run: python tools/cli.py sync

      - name: Check upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '[keys]\ngithub = "%s"\n' "$GH_TOKEN" > "$RUNNER_TEMP/nvchecker-keys.toml"
          nvchecker --failures \
            -k "$RUNNER_TEMP/nvchecker-keys.toml" \
            -c nvchecker.toml
          nvcmp -j -s none -c nvchecker.toml > "$RUNNER_TEMP/updates.json"

      - name: Apply nvchecker results
        run: |
          python tools/cli.py apply \
            --input "$RUNNER_TEMP/updates.json" \
            --applied-output "$RUNNER_TEMP/applied.txt"

      - name: Detect empty update
        id: updates
        run: |
          if [[ -s "$RUNNER_TEMP/applied.txt" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate .SRCINFO
        if: steps.updates.outputs.changed == 'true'
        run: |
          python tools/cli.py srcinfo \
            --packages-file "$RUNNER_TEMP/applied.txt" \
            --require-makepkg

      # Gates the AUR push on content that only exists at this point: the
      # PKGBUILDs and .SRCINFO files the previous two steps just generated.
      # Linting and unit tests are not repeated here -- they cover tools/, which
      # this workflow never modifies, and check.yml already ran them on push.
      - name: Verify generated packages
        if: steps.updates.outputs.changed == 'true'
        run: python tools/cli.py verify --require-makepkg

      - name: Accept processed nvchecker results
        if: steps.updates.outputs.changed == 'true'
        run: |
          mapfile -t packages < "$RUNNER_TEMP/applied.txt"
          nvtake -c nvchecker.toml "${packages[@]}"

      - name: Configure AUR SSH key
        if: steps.updates.outputs.changed == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/known_hosts.candidate"
          ssh-keygen -lf "$HOME/.ssh/known_hosts.candidate" -E sha256 \
            | grep -F 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          mv "$HOME/.ssh/known_hosts.candidate" "$HOME/.ssh/known_hosts"

      - name: Publish changed packages to AUR
        if: steps.updates.outputs.changed == 'true'
        run: |
          git config --global user.name mzwing
          git config --global user.email mzwing@mzwing.eu.org
          git config --global init.defaultBranch master
          python tools/cli.py publish \
            --packages-file "$RUNNER_TEMP/applied.txt" \
            --work-dir "$RUNNER_TEMP/aur"

      # Runs unconditionally: `devenv update` may have refreshed devenv.lock even
      # on a night when no package changed. Recording it keeps check.yml and this
      # workflow on the same toolchain and makes a bad input bump bisectable.
      - name: Commit updates to GitHub
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name mzwing
          git config user.email mzwing@mzwing.eu.org
          committed=false

          if ! git diff --quiet -- devenv.lock; then
            git add devenv.lock
            git commit -m "chore(devenv): update inputs"
            committed=true
          fi

          if [[ -s "$RUNNER_TEMP/applied.txt" ]]; then
            mapfile -t packages < "$RUNNER_TEMP/applied.txt"
            git add .nvchecker/oldver.json "${packages[@]}"
            package_list=$(IFS=', '; echo "${packages[*]}")
            git commit -m "chore(packages): update $package_list"
            committed=true
          fi

          if [[ "$committed" == true ]]; then
            git push origin "HEAD:$DEFAULT_BRANCH"
          else
            echo "nothing to commit"
          fi
