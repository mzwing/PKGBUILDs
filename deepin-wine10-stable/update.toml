# `cmd` is filled in by `pkgtool sync`: the interpreter and script path depend
# on the checkout, and the package name is already the directory name.
[check]
source = "cmd"

[update]
updater = "apt"
repo_root = "https://pro-store-packages.uniontech.com/appstore/"
distribution = "eagle-pro"
component = "appstore"
architecture = "amd64"
package = "deepin-wine10-stable"
variable = "_pkgver"
